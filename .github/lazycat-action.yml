version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cfui.lpk
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: cfui
build:
  run_buildscript: false
images:
  - id: cfui
    target: service
    service: cfui
    source: czyt/cfui
    channel: stable
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Cloudflared UI
    summary: 现代化、易用的 Cloudflare Tunnel 管理面板
